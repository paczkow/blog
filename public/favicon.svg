<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="paczkow.me">
  <!--
    Lowercase "p" monogram on a filled plate. Drawn as strokes rather than text
    so it renders identically everywhere — a favicon has no web fonts available.
    Colors are the sand-1/sand-12 ends of the site palette (src/styles/global.css)
    and swap under prefers-color-scheme so the plate stays legible against both
    light and dark browser chrome.
  -->
  <style>
    .plate { fill: #21201c; }
    .mark { fill: none; stroke: #fdfdfc; stroke-width: 3.2; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #eeeeec; }
      .mark { stroke: #222221; }
    }
  </style>
  <rect class="plate" width="32" height="32" rx="7.5" />
  <path class="mark" stroke-linecap="round" d="M11.2 8.4v15.2" />
  <circle class="mark" cx="17.2" cy="14.4" r="4.6" />
</svg>
